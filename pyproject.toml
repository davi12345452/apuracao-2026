[project]
name = "apuracao-2026"
version = "0.1.0"
description = "Painel local da apuração do 2º turno presidencial de 2026 (exterior ao vivo, abstenção, projeções)"
requires-python = ">=3.11"
dependencies = ["analise-urnas", "requests>=2.31"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
